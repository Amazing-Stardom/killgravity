name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run verification
        run: |
          make check
          make test
          make audit

      - name: Package release archive
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          ARCHIVE_NAME="killgravity-${TAG_NAME}.tar.gz"
          tar --exclude-vcs --exclude='.github' -czvf "$ARCHIVE_NAME" *
          sha256sum "$ARCHIVE_NAME" > "${ARCHIVE_NAME}.sha256"
          echo "ARCHIVE_NAME=$ARCHIVE_NAME" >> $GITHUB_ENV

      - name: Package Antigravity IDE Extension (.vsix)
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          VSIX_NAME="killgravity-${TAG_NAME}.vsix"
          cd ide-extension
          npx --yes @vscode/vsce package --allow-missing-repository -o "../${VSIX_NAME}"
          cd ..
          sha256sum "$VSIX_NAME" > "${VSIX_NAME}.sha256"
          echo "VSIX_NAME=$VSIX_NAME" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ARCHIVE_NAME }}
            ${{ env.ARCHIVE_NAME }}.sha256
            ${{ env.VSIX_NAME }}
            ${{ env.VSIX_NAME }}.sha256
          generate_release_notes: true
