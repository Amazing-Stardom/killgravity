# ==============================================================================
# killgravity configuration file
# Place this at ~/.config/killgravity/killgravity.conf (user mode)
# or /etc/killgravity/killgravity.conf (system mode).
# ==============================================================================

# Target process pattern to monitor and terminate upon write spikes.
# NOTE: "antigravity-ide" specifically targets the IDE and avoids accidentally
# killing the Antigravity agent CLI, hub, or helper background processes.
TARGET_PATTERN="antigravity-ide"

# Threshold of disk write speed (in sectors/second) to consider runaway dump creation.
# Default: 1,000,000 sectors/s (~500 MB/s over 2 seconds).
# During crash dump loops, Antigravity IDE attempts to write 8-16 GB dumps at full
# NVMe disk speed (often 1-3 GB/s), quickly triggering this threshold.
WRITE_THRESHOLD_SECTORS=1000000

# Polling interval in seconds.
POLL_INTERVAL=2

# Automatically relaunch the IDE after terminating runaway processes.
# Set to false if you prefer manual relaunching.
AUTO_RESTART=true

# Explicit path to the Antigravity IDE binary.
# Leave empty to allow killgravity to automatically detect it across /opt and PATH.
RESTART_BIN=""

# Flags passed to the IDE when restarting.
# --disable-crash-reporter disables the Chromium crashpad reporter that causes runaway dumps.
RESTART_FLAGS="--disable-crash-reporter"

# Delay in seconds to wait before restarting the IDE after a kill.
RESTART_DELAY=5

# Cooldown time in seconds after a kill/restart event before resuming active checks.
# Prevents restart flapping while the IDE finishes its startup sequence.
COOLDOWN_SECONDS=60

# Clean up leftover .dmp, core.*, and crashpad files after terminating.
CLEANUP_DUMPS=true

